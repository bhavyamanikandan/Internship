<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
        }

        header {
            background: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 200px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            background: #333;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #555;
        }

        .students {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .student-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .student-card h3 {
            margin-top: 0;
        }

        #summary {
            background: white;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        @media (max-width: 700px) {
            .students {
                grid-template-columns: 1fr;
            }

            input {
                width: 100%;
                margin: 5px 0;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Student Performance Tracker</h1>
        <p>JavaScript ES6+ Project</p>
    </header>

    <main class="container">

        <section class="controls">

            <h2>Add Student</h2>

            <input
                type="text"
                id="name"
                placeholder="Student Name"
            >

            <input
                type="number"
                id="marks"
                placeholder="Marks"
                min="0"
                max="100"
            >

            <button id="addBtn">Add Student</button>

            <br>

            <button id="allBtn">All Students</button>
            <button id="passedBtn">Passed Students</button>

        </section>

        <section id="summary">
            <h2>Summary</h2>
            <p id="summaryText">Loading...</p>
        </section>

        <section>
            <h2>Students</h2>
            <div id="students" class="students"></div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
