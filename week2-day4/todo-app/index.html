<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dynamic To-Do List | Week 2 Day 4</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #f996c4;
            color: #1f2937;
        }

        .todo-container {
            width: 100%;
            max-width: 600px;
            padding: 30px;
            background: #d5a9fc;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 8px;
            text-align: center;
            color: #2563eb;
        }

        .subtitle {
            margin-bottom: 25px;
            text-align: center;
            color: #6b7280;
        }

        .todo-form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        #todo-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
        }

        #todo-input:focus {
            outline: 2px solid #2563eb;
            border-color: transparent;
        }

        #add-button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            cursor: pointer;
            font-weight: 600;
        }

        #add-button:hover {
            background: #1d4ed8;
        }

        #todo-list {
            list-style: none;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #ead6b1;
        }

        .todo-text {
            flex: 1;
            cursor: pointer;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .delete-button {
            padding: 7px 12px;
            border: none;
            border-radius: 6px;
            background: #dc2626;
            color: #ffffff;
            cursor: pointer;
        }

        .delete-button:hover {
            background: #a40000;
        }

        .empty-message {
            text-align: center;
            color: #9ebbef;
            padding: 20px;
        }

        @media (max-width: 480px) {
            .todo-container {
                padding: 20px;
            }

            .todo-form {
                flex-direction: column;
            }

            #add-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="todo-container">
        <h1>My To-Do List</h1>

        <p class="subtitle">
            Week 2 - Day 4: DOM Manipulation
        </p>

        <form id="todo-form" class="todo-form">
            <input
                type="text"
                id="todo-input"
                placeholder="Enter a task..."
                autocomplete="off"
            >

            <button type="submit" id="add-button">
                Add Task
            </button>
        </form>

        <ul id="todo-list"></ul>

        <p id="empty-message" class="empty-message">
            No tasks yet. Add your first task!
        </p>
    </main>

    <script src="script.js"></script>

</body>
</html>
